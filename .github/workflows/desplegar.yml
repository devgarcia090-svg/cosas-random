# Despliega mayarottweiler.com en Cloudflare al subir cambios.
#
# Por qué esto y no que Claude despliegue desde su sesión: el token
# vive solo aquí, en los secretos del repositorio, y no pasa por
# ninguna conversación. Además así se despliega aunque no haya nadie
# delante.
#
# PARA ACTIVARLO (una vez):
#   1. En Cloudflare, My Profile -> API Tokens -> Create Token,
#      plantilla "Edit Cloudflare Workers".
#   2. En GitHub: Settings -> Secrets and variables -> Actions ->
#      New repository secret, con nombre CLOUDFLARE_API_TOKEN.
#   3. Listo. Cada push que toque la web la publica.
#
# Si falta el secreto, el trabajo se salta con un aviso en vez de
# fallar, para no llenarte el correo de errores rojos.

name: Desplegar la web

on:
  push:
    branches:
      - claude/cloudflare-deploy-recovery-8suhww
    paths:
      - 'sitio-recuperado/**'
      - 'src/**'
      - 'wrangler.jsonc'
      - '.github/workflows/desplegar.yml'
  workflow_dispatch:          # botón para lanzarlo a mano

jobs:
  desplegar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # La pagina de GitHub tiene dos pestanas, "Secrets" y "Variables".
      # Si el token acaba en Variables no se puede desplegar Y ADEMAS
      # queda a la vista de cualquiera, porque las variables no se
      # cifran y este repositorio es publico. Por eso se distingue.
      - name: Comprobar que hay token
        id: token
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "hay=si" >> "$GITHUB_OUTPUT"
            echo "Token encontrado en Secrets. Correcto."
          elif [ -n "${{ vars.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "hay=no" >> "$GITHUB_OUTPUT"
            echo "::error::El token esta en la pestana VARIABLES, no en SECRETS. Las variables NO se cifran y este repositorio es publico: ese token hay que REVOCARLO en Cloudflare y crear uno nuevo en Secrets."
            exit 1
          else
            echo "hay=no" >> "$GITHUB_OUTPUT"
            echo "::warning::No hay ningun CLOUDFLARE_API_TOKEN. Comprueba: (1) que esta en Settings -> Secrets and variables -> Actions, pestana Secrets; (2) que es un secreto de REPOSITORIO y no de Environment; (3) que el nombre es exactamente CLOUDFLARE_API_TOKEN."
          fi

      # NPM_CONFIG_YES: sin esto npx pide confirmacion para instalar
      # wrangler, no la recibe, y acaba corriendo una version antigua
      # que no entiende wrangler.jsonc: falla diciendo que falta el
      # punto de entrada aunque si este declarado.
      # wranglerVersion: fijada para que un cambio de "latest" no
      # rompa el despliegue un dia cualquiera sin haber tocado nada.
      - name: Publicar en Cloudflare
        if: steps.token.outputs.hay == 'si'
        uses: cloudflare/wrangler-action@v3
        env:
          NPM_CONFIG_YES: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4.42.0'
          command: deploy

      - name: Comprobar que la web responde
        if: steps.token.outputs.hay == 'si'
        run: |
          sleep 15
          for url in "" guias requisitos-rottweiler-espana; do
            codigo=$(curl -s -o /dev/null -w "%{http_code}" "https://mayarottweiler.com/$url")
            echo "/$url -> $codigo"
            [ "$codigo" = "200" ] || exit 1
          done
          # La tienda debe seguir pidiendo contraseña.
          codigo=$(curl -s -o /dev/null -w "%{http_code}" "https://mayarottweiler.com/tienda")
          echo "/tienda -> $codigo (debe ser 401)"
          [ "$codigo" = "401" ] || exit 1
