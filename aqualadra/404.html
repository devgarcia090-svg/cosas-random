<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="css/tipografias.css">

<style>
  .perdido {
    min-height: 100vh;
    display: grid;
    place-content: center;
    text-align: center;
    padding: 2rem var(--gutter);
    background:
      radial-gradient(700px 420px at 20% 0%, var(--aqua-100), transparent 62%),
      radial-gradient(620px 380px at 88% 12%, var(--sand-200), transparent 60%),
      var(--cream);
  }
  .perdido img { width: 148px; margin: 0 auto 1.5rem; }
  .perdido p { color: var(--ink-2); max-width: 30rem; margin-inline: auto; font-size: 1.1rem; }
  .perdido .acciones { display: flex; flex-wrap: wrap; gap: .8rem; justify-content: center; margin-top: 2rem; }
</style>
</head>
<body>
<main class="perdido">
  <picture>
    <source srcset="img/emblema.webp" type="image/webp">
    <img src="img/emblema.png" alt="Logo de AquaLadra" width="160" height="160">
  </picture>
  <h1>Esta página se ha escapado</h1>
  <p>Se nos ha ido corriendo con el champú en la cabeza. Vuelve al inicio y te llevamos a lo que buscabas.</p>
  <div class="acciones">
    <a class="btn btn--lg" href="/">Volver al inicio</a>
    <a class="btn btn--lg btn--sand" href="/#reservar">Reservar cita</a>
