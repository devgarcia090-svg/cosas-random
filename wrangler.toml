# ══════════════════════════════════════════════════════════════════════
# Estudio Olfato · despliegue en Cloudflare Workers (static assets)
#
# Este fichero despliega ÚNICAMENTE la carpeta estudio-olfato/.
# El Worker se llama "olfatoestudio", así que `wrangler deploy` NUNCA
# puede tocar el Worker "mayarottweiler" de la web de Maya, ni al
# revés. Son dos Workers distintos en la misma cuenta.
#
# Se llamaba "estudio-olfato" y hubo que cambiarlo: ese Worker se quedó
# sirviendo una versión antigua congelada en el borde de Cloudflare. Los
# despliegues creaban versiones nuevas, la API confirmaba el 100 % en la última,
# y aun así respondía HTML viejo y daba 404 a ficheros recién subidos. Con un
# nombre nuevo el problema desapareció. Si vuelve a pasar, la salida es la
# misma: renombrar.
# ══════════════════════════════════════════════════════════════════════

name = "olfatoestudio"
account_id = "c21d634c54dbb741978cf0efd1135bc8"
compatibility_date = "2026-08-26"

# Casi todo el sitio son ficheros servidos directamente. La única excepción
# es /video/*: el asset server no responde a las peticiones por rango, y sin
# ellas Safari no reproduce vídeo. `run_worker_first` hace que solo esas rutas
# pasen por el código; el resto ni lo invoca.
main = "worker/index.js"

[assets]
directory = "./estudio-olfato"
not_found_handling = "404-page"
binding = "ASSETS"
run_worker_first = ["/video/*"]
